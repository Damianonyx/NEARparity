name: API access check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # weekly
  push:
    paths:
      - 'scripts/check-apis.mjs'
      - '.github/workflows/api-check.yml'

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probe every candidate API (no keys or dependencies)
        run: node --use-env-proxy scripts/check-apis.mjs "$RUNNER_TEMP/api-check.json"
      - name: Save timestamped access results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-check.json
          if-no-files-found: warn
          retention-days: 14
