name: Refresh data

# Rebuilds data/ and commits it to main. Vercel redeploys main on every push, including these commits.
# Runs twice daily (after DefiLlama fills the previous UTC day, and again in the afternoon), on demand,
# and when build code changes on main. Partial refreshes keep last good values (marked stale); after two
# partial runs in a row, or any crash, an issue labelled `data-refresh` is opened, and closed on recovery.
on:
  schedule:
    - cron: '41 5 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: read

concurrency:
  group: refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      id-token: write # Google sign-in for the BigQuery trace (Workload Identity Federation; no stored keys)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tests
        run: node scripts/test.mjs && node scripts/test-integration.mjs
      - name: Build data (no stored keys, no dependencies)
        id: build
        run: |
          set +e
          node --use-env-proxy scripts/build-data.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "consecutive=$(node -e "console.log(require('./data/status.json').consecutive_partial_runs ?? 0)")" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::warning::Partial refresh: a source failed; previous good values were kept and marked stale (see data/status.json)."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi
      - name: Data contract
        run: node scripts/check-data.mjs
      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 14
      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then echo 'No data changes.'; exit 0; fi
          git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Health alert (open or update an issue)
        if: failure() || (steps.build.outputs.code == '2' && steps.build.outputs.consecutive >= 2)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-refresh --color B60205 --description "Automated data refresh health" --force >/dev/null 2>&1 || true
          body="The data refresh did not fully succeed (exit code '${{ steps.build.outputs.code }}', consecutive partial runs: ${{ steps.build.outputs.consecutive }}). Run: $RUN_URL. The site keeps the last good values, marked stale; see data/status.json for the failing sources."
          n=$(gh issue list --label data-refresh --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Data refresh is failing" --label data-refresh --body "$body"; fi
      - name: Health recovered (close the issue)
        if: success() && steps.build.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label data-refresh --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue close "$n" --comment "Recovered: the latest refresh succeeded."; fi
