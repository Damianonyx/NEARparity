name: Verify thesis sources

# Re-fetches the primary sources behind THESIS.md claims. Fails if a required source no longer supports its claim.
# Dated evidence (HTTP status, body hash, passages) is uploaded as an artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    paths:
      - 'scripts/verify-claims.mjs'
      - '.github/workflows/verify-claims.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/verify-claims.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: docs/verification/
          retention-days: 90
